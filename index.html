<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FinTrack : transactions, budgets personnels, professionnels et familiaux, coffre-fort chiffré." />
    <meta name="theme-color" content="#0F172A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FinTrack" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://jbzmfbeuldlsaybsxgaj.supabase.co" crossorigin />
    <title>FinTrack — Gestion Financière Intelligente</title>

    <style>
      html,body{margin:0;background:#0b1220}
      .ft-splash{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 38%,#17264a 0%,#0b1220 68%);color:#e2e8f0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden}
      .ft-stage{position:relative;width:220px;height:220px}
      .ft-glow{position:absolute;inset:40px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.45),rgba(16,185,129,.18) 55%,transparent 72%);filter:blur(10px);animation:ft-pulse 2.4s ease-in-out infinite}
      .ft-ring{position:absolute;inset:10px;border-radius:50%;border:1px dashed rgba(148,163,184,.35)}
      .ft-orbit{position:absolute;inset:10px;animation:ft-spin 8s linear infinite}
      .ft-badge{position:absolute;top:-18px;left:calc(50% - 18px);width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:ft-spin 8s linear infinite reverse}
      .ft-badge svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .ft-o2,.ft-o2 .ft-badge{animation-delay:-2s}.ft-o3,.ft-o3 .ft-badge{animation-delay:-4s}.ft-o4,.ft-o4 .ft-badge{animation-delay:-6s}
      .ft-o1 .ft-badge{background:#F59E0B}.ft-o2 .ft-badge{background:#F43F5E}.ft-o3 .ft-badge{background:#8B5CF6}.ft-o4 .ft-badge{background:#10B981}
      .ft-logo{position:absolute;left:68px;top:68px;width:84px;height:84px;animation:ft-float 3s ease-in-out infinite;filter:drop-shadow(0 10px 22px rgba(59,130,246,.45))}
      .ft-chart{position:relative;display:flex;align-items:flex-end;gap:5px;height:38px;margin-top:-4px}
      .ft-chart i{display:block;width:7px;height:38px;border-radius:3px;background:linear-gradient(180deg,#3B82F6,#10B981);transform-origin:bottom;animation:ft-bar 1.5s ease-in-out infinite alternate}
      .ft-chart i:nth-of-type(1){animation-delay:-1.3s}.ft-chart i:nth-of-type(2){animation-delay:-.9s}.ft-chart i:nth-of-type(3){animation-delay:-.5s}.ft-chart i:nth-of-type(4){animation-delay:-1.1s}.ft-chart i:nth-of-type(5){animation-delay:-.2s}.ft-chart i:nth-of-type(6){animation-delay:-.7s}.ft-chart i:nth-of-type(7){animation-delay:-1.5s}
      .ft-chart b{position:absolute;top:-30px;width:9px;height:9px;border-radius:50%;background:#FBBF24;box-shadow:0 0 8px rgba(251,191,36,.8);opacity:0;animation:ft-coin 1.8s ease-in infinite}
      .ft-chart b:nth-of-type(1){left:6px}.ft-chart b:nth-of-type(2){left:30px;animation-delay:-.6s}.ft-chart b:nth-of-type(3){left:54px;animation-delay:-1.2s}
      .ft-brand{font-size:22px;font-weight:700;letter-spacing:.02em;color:#fff}
      .ft-msgs{position:relative;height:20px;width:min(86vw,320px);text-align:center;font-size:13px;color:#94a3b8}
      .ft-msgs span{position:absolute;inset:0;opacity:0;animation:ft-msg 8s infinite}
      .ft-msgs span:nth-child(2){animation-delay:2s}.ft-msgs span:nth-child(3){animation-delay:4s}.ft-msgs span:nth-child(4){animation-delay:6s}
      .ft-progress{width:160px;height:3px;border-radius:3px;background:rgba(148,163,184,.2);overflow:hidden}
      .ft-progress i{display:block;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,#3B82F6,#10B981);animation:ft-slide 1.3s ease-in-out infinite}
      @keyframes ft-spin{to{transform:rotate(360deg)}}
      @keyframes ft-pulse{0%,100%{opacity:.7;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
      @keyframes ft-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes ft-bar{from{transform:scaleY(.18)}to{transform:scaleY(1)}}
      @keyframes ft-coin{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(40px);opacity:0}}
      @keyframes ft-msg{0%{opacity:0;transform:translateY(6px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateY(-6px)}}
      @keyframes ft-slide{from{transform:translateX(-110%)}to{transform:translateX(280%)}}
      @media (prefers-reduced-motion:reduce){.ft-orbit,.ft-badge,.ft-chart i,.ft-chart b,.ft-glow,.ft-logo,.ft-progress i{animation:none}.ft-chart i{transform:scaleY(.7)}.ft-progress i{width:100%}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ft-splash" role="status" aria-live="polite" aria-label="Chargement de FinTrack">
        <div class="ft-stage">
          <div class="ft-glow"></div><div class="ft-ring"></div>
          <div class="ft-orbit ft-o1"><span class="ft-badge"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1 1-1.5 2.5-1.5s2.5.6 2.5 1.8c0 2.4-5 1.4-5 3.8 0 1.2 1.1 1.9 2.5 1.9s2.5-.6 2.5-1.6"/></svg></span></div>
          <div class="ft-orbit ft-o2"><span class="ft-badge"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.3"/><path d="M17 14c2.6 0 4.5 2 4.5 4.5"/></svg></span></div>
          <div class="ft-orbit ft-o3"><span class="ft-badge"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg></span></div>
          <div class="ft-orbit ft-o4"><span class="ft-badge"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 7.8-8 9-4.6-1.2-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></span></div>
          <svg class="ft-logo" viewBox="0 0 120 120" fill="none" aria-hidden="true"><defs><linearGradient id="ftbg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E293B"/></linearGradient><linearGradient id="ftac" x1="0" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#10B981"/></linearGradient></defs><rect x="6" y="6" width="108" height="108" rx="28" fill="url(#ftbg)"/><path d="M60 26 L88 42 L88 78 L60 94 L32 78 L32 42 Z" fill="none" stroke="url(#ftac)" stroke-width="3"/><path d="M46 78 L46 42 L74 42" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M46 60 L66 60" stroke="white" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M58 68 L66 58 L72 64 L82 50" stroke="url(#ftac)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M76 50 L82 50 L82 56" stroke="url(#ftac)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </div>
        <div class="ft-chart" aria-hidden="true"><b></b><b></b><b></b><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="ft-brand">FinTrack</div>
        <div class="ft-msgs"><span>Comptage des pièces…</span><span>Rassemblement de la famille…</span><span>Mise en ordre des dossiers…</span><span>Verrouillage du coffre-fort…</span></div>
        <div class="ft-progress"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
